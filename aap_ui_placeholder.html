<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>aap-ui</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 2 4 6v9c0 7.5 5.1 13.4 12 15 6.9-1.6 12-7.5 12-15V6z' fill='%23238636'/><path d='m10 16 4 4 8-8' fill='none' stroke='%23fff' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
<style>
  :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8b949e; --red-h: #f85149; }
  * { box-sizing: border-box; }
  body { margin: 0; padding-bottom: 40px; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
  /* min-height keeps the height the header has with its (removed) tabs. */
  header { display: flex; align-items: center; min-height: 59px; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--card); position: sticky; top: 0; z-index: 10; }
  header h1 { margin: 0; font-size: 16px; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  .status-dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--red-h); box-shadow: 0 0 0 3px rgba(248, 81, 73, 0.25); }
  .queue-panel { position: fixed; inset: auto 0 0; height: 40px; z-index: 20; display: flex; flex-direction: column; background: #111b27; border-top: 1px solid var(--border); }
  .queue-inner { width: 100%; max-width: 960px; flex: 1; margin: 0 auto; padding: 10px 16px; display: flex; flex-direction: column; justify-content: center; }
  .queue-title { margin: 0; font-size: 13px; font-weight: 400; color: var(--muted); }
  @media (max-width: 640px) { header { min-height: 55px; padding: 12px 16px; } }
</style>
</head>
<body>
<header>
  <h1><span class="status-dot"></span>aap-ui</h1>
</header>
<section class="queue-panel">
  <div class="queue-inner">
    <h2 class="queue-title">Nothing to review</h2>
  </div>
</section>
</body>
</html>
